# Публичная точка входа на хосте. Фронт и API живут на ОДНОМ домене:
#   /          -> контейнер web  (127.0.0.1:8080), статика SPA
#   /api/      -> контейнер api  (127.0.0.1:4000), Express
#   /uploads/  -> контейнер api  (127.0.0.1:4000), express.static с фото
#
# Один origin для фронта и API означает, что CORS вообще не задействован,
# а assetUrl() во фронте корректно собирает ссылки на фото.
#
# Установка:
#   sudo cp deploy/nginx/allyshop-crm.conf /etc/nginx/sites-available/allyshop-crm.conf
#   sudo ln -s /etc/nginx/sites-available/allyshop-crm.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем certbot сам допишет сюда 443-блок и редирект с 80:
#   certbot --nginx -d allyshop.work -d www.allyshop.work

server {
    listen 80;
    listen [::]:80;
    server_name allyshop.work www.allyshop.work;

    # multer ограничивает файл 5 МБ, даём запас на multipart-обвязку.
    client_max_body_size 10M;

    # Статика SPA
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Запросы к API Новой Почты бывают медленными.
        proxy_read_timeout 120s;
    }

    # Загруженные фото товаров
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }
}
