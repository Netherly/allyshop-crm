# Раздача SPA внутри контейнера web. Публичный HTTPS и проксирование /api
# делает nginx на хосте (deploy/nginx/allyshop-crm.conf).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ассеты Vite содержат хеш в имени, поэтому неизменяемы.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, иначе браузер продолжит грузить старую сборку.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # react-router: любой неизвестный путь отдаём в index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
